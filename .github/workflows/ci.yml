name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - name: Start AgileConfig test instance
        run: docker compose up -d
      - name: Wait for AgileConfig readiness
        shell: bash
        run: |
          for i in {1..30}; do
            for endpoint in /health /api/health /; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000${endpoint}" || true)
              if [ -z "$code" ]; then
                code="000"
              fi
              if [ "$code" = "200" ]; then
                echo "AgileConfig is ready via ${endpoint}"
                exit 0
              fi
            done
            sleep 2
          done
          echo "AgileConfig did not become ready in time"
          docker compose logs
          exit 1
      - name: Run unit tests
        id: unit_tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s unit_tests -v 2>&1 | tee "unit-tests-${{ matrix.python-version }}.log"
      - name: Capture container logs on failure
        if: failure()
        run: docker compose logs > "docker-compose-${{ matrix.python-version }}.log"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-py${{ matrix.python-version }}
          path: |
            unit-tests-${{ matrix.python-version }}.log
            docker-compose-${{ matrix.python-version }}.log
          if-no-files-found: ignore
      - name: Test summary
        if: always()
        run: |
          if [ "${{ steps.unit_tests.outcome }}" = "success" ]; then
            echo "✅ Python ${{ matrix.python-version }} unit tests passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Python ${{ matrix.python-version }} unit tests failed. See uploaded artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tear down AgileConfig test instance
        if: always()
        run: docker compose down -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install twine
      - run: python -m twine check dist/*